[package]
name = "pixellift"
version = "0.1.0"
edition = "2021"
description = "AI video upscaler — SD to HD to UHD with Real-ESRGAN, wrapped in a friendly CLI and GUI"
license = "Apache-2.0"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ctrlc = "3"
eframe = "0.27"
rfd = "0.14"

[profile.release]
opt-level = 3
lto = true
