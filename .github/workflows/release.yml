name: build-release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-14
            target: ""
            ff: macos-arm64
            ffext: ""
          - name: macos-intel
            os: macos-14
            target: x86_64-apple-darwin
            ff: macos-amd64
            ffext: ""
          - name: linux-amd64
            os: ubuntu-22.04
            target: ""
            ff: linux-amd64
            ffext: ""
          - name: windows-amd64
            os: windows-2022
            target: ""
            ff: windows-amd64
            ffext: .exe
    runs-on: ${{ matrix.os }}
    env:
      FFEXT: ${{ matrix.ffext }}
      BIN: pixellift${{ matrix.ffext }}
      BIN_PATH: target/${{ matrix.target }}/release/pixellift${{ matrix.ffext }}
      DIST: dist/pixellift-${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Add cross-compile target
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}

      - name: Build (release)
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            cargo build --release --target ${{ matrix.target }}
          else
            cargo build --release
          fi

      - name: Download FFmpeg static binaries (mwader/static-ffmpeg v7.1)
        run: |
          curl -sL -o ffmpeg$FFEXT "https://github.com/mwader/static-ffmpeg/releases/download/v7.1/ffmpeg.${{ matrix.ff }}${{ matrix.ffext }}"
          curl -sL -o ffprobe$FFEXT "https://github.com/mwader/static-ffmpeg/releases/download/v7.1/ffprobe.${{ matrix.ff }}${{ matrix.ffext }}"
          chmod +x ffmpeg$FFEXT ffprobe$FFEXT

      - name: Download Real-ESRGAN sidecar + models
        run: |
          curl -sL -o esrgan.zip "https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0/${{ matrix.esrgan }}"
          unzip -q -o esrgan.zip -d sidecars_esrgan
          rm esrgan.zip

      - name: Assemble package
        run: |
          mkdir -p "$DIST/sidecars/realesrgan"
          cp "$BIN_PATH" "$DIST/$BIN"
          cp ffmpeg$FFEXT ffprobe$FFEXT "$DIST/"
          # the 20220424 zips carry binary + models/ at the zip root
          cp sidecars_esrgan/realesrgan-ncnn-vulkan* "$DIST/sidecars/realesrgan/"
          cp -r sidecars_esrgan/models "$DIST/sidecars/realesrgan/models"
          cp README.md THIRD-PARTY-NOTICES.txt "$DIST/"
          if [ "$RUNNER_OS" != "Windows" ]; then
            chmod +x "$DIST/$BIN" "$DIST/ffmpeg$FFEXT" "$DIST/ffprobe$FFEXT" \
                     "$DIST/sidecars/realesrgan/realesrgan-ncnn-vulkan"*
          fi
        env:
          ESRGAN_PKG: ${{ matrix.esrgan }}

      - name: Zip
        run: |
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            tar -a -c -f "pixellift-${{ matrix.name }}.zip" "pixellift-${{ matrix.name }}"
          else
            zip -qr "pixellift-${{ matrix.name }}.zip" "pixellift-${{ matrix.name }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: pixellift-${{ matrix.name }}
          path: dist/*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --generate-notes --title "PixelLift $GITHUB_REF_NAME"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
