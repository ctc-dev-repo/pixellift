name: build-release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-14
            target: ""
            ff: macos-arm64
            ffext: ""
            esrgan: realesrgan-ncnn-vulkan-20220424-macos.zip
          - name: linux-amd64
            os: ubuntu-22.04
            target: ""
            ff: linux-amd64
            ffext: ""
            esrgan: realesrgan-ncnn-vulkan-20220424-ubuntu.zip
          - name: windows-amd64
            os: windows-2022
            target: ""
            ff: windows-amd64
            ffext: .exe
            esrgan: realesrgan-ncnn-vulkan-20220424-windows.zip
    runs-on: ${{ matrix.os }}
    env:
      FFEXT: ${{ matrix.ffext }}
      BIN: pixellift${{ matrix.ffext }}
      BIN_PATH: target/${{ matrix.target }}/release/pixellift${{ matrix.ffext }}
      DIST: dist/pixellift-${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Add cross-compile target
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}

      - name: Build (release)
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            cargo build --release --target ${{ matrix.target }}
          else
            cargo build --release
          fi

      - name: Download FFmpeg (macOS — evermeet.cx)
        if: runner.os == 'macOS'
        run: |
          curl -fL --retry 3 -o ffmpeg.zip "https://evermeet.cx/ffmpeg/getrelease/ffmpeg/zip"
          curl -fL --retry 3 -o ffprobe.zip "https://evermeet.cx/ffmpeg/getrelease/ffprobe/zip"
          python3 -c "import zipfile; zipfile.ZipFile('ffmpeg.zip').extractall('.'); zipfile.ZipFile('ffprobe.zip').extractall('.')"
          chmod +x ffmpeg ffprobe

      - name: Download FFmpeg (Linux / Windows — BtbN builds)
        if: runner.os != 'macOS'
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            URL="https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz"
            EXT=".tar.xz"
          else
            URL="https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
            EXT=".zip"
          fi
          curl -fL --retry 3 -o ffmpeg_pkg "$URL"
          mkdir -p ffmpeg_pkg_x
          if [ "$EXT" = ".tar.xz" ]; then
            tar -xf ffmpeg_pkg -C ffmpeg_pkg_x
          else
            python3 -c "import zipfile; zipfile.ZipFile('ffmpeg_pkg').extractall('ffmpeg_pkg_x')"
          fi
          FF="$(find ffmpeg_pkg_x -type f -name 'ffmpeg*' ! -name '*.html' | head -1)"
          FP="$(find ffmpeg_pkg_x -type f -name 'ffprobe*' | head -1)"
          cp "$FF" ffmpeg$FFEXT
          cp "$FP" ffprobe$FFEXT
          chmod +x ffmpeg$FFEXT ffprobe$FFEXT

      - name: Download Real-ESRGAN sidecar + models
        run: |
          curl -fL --retry 3 --retry-delay 5 -o esrgan.zip "https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0/${{ matrix.esrgan }}"
          python3 -c "import zipfile; zipfile.ZipFile('esrgan.zip').extractall('sidecars_esrgan')"
          rm esrgan.zip

      - name: Assemble package
        run: |
          mkdir -p "$DIST/sidecars/realesrgan"
          cp "$BIN_PATH" "$DIST/$BIN"
          cp ffmpeg$FFEXT ffprobe$FFEXT "$DIST/"
          # the 20220424 zips carry binary + models/ at the zip root
          cp sidecars_esrgan/realesrgan-ncnn-vulkan* "$DIST/sidecars/realesrgan/"
          cp -r sidecars_esrgan/models "$DIST/sidecars/realesrgan/models"
          cp README.md THIRD-PARTY-NOTICES.txt "$DIST/"
          if [ "$RUNNER_OS" != "Windows" ]; then
            chmod +x "$DIST/$BIN" "$DIST/ffmpeg$FFEXT" "$DIST/ffprobe$FFEXT" \
                     "$DIST/sidecars/realesrgan/realesrgan-ncnn-vulkan"*
          fi
        env:
          ESRGAN_PKG: ${{ matrix.esrgan }}

      - name: Zip
        run: |
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            tar -a -c -f "pixellift-${{ matrix.name }}.zip" "pixellift-${{ matrix.name }}"
          else
            zip -qr "pixellift-${{ matrix.name }}.zip" "pixellift-${{ matrix.name }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: pixellift-${{ matrix.name }}
          path: dist/*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Create GitHub release
        run: |
          cd dist
          gh release create "$GITHUB_REF_NAME" *.zip --generate-notes --title "PixelLift $GITHUB_REF_NAME"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
